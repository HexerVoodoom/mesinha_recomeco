name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # IMPORTANTE: o slug em produção é make-server-19717bce (é ele que o app,
      # os widgets e o cron chamam). O entrypoint aponta para functions/server/
      # via supabase/config.toml. Deploy no slug "server" NÃO chega à produção.
      - name: Deploy Edge Functions
        run: supabase functions deploy make-server-19717bce --project-ref oubdmmaqxnutbbxiqeow
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
